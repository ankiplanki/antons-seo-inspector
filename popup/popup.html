<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anton's SEO Inspector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="title">Anton's SEO Inspector</span>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="indexability">Indexability</button>
    <button class="tab" data-tab="link-scanner">Link Scanner</button>
  </nav>

  <div id="panel-indexability" class="tab-panel active">
    <div class="header-actions">
      <button id="idxScanBtn" class="btn btn-primary">Scan</button>
    </div>
    <div id="idxStatus" class="status-msg"></div>
    <div id="idxSummary" class="idx-summary"></div>
    <div id="idxResults"></div>
  </div>

  <div id="panel-link-scanner" class="tab-panel">
    <div class="header-actions">
      <button id="highlightBtn" class="btn btn-secondary" hidden>Highlight Links</button>
      <button id="copyAll" class="btn btn-secondary" hidden>Copy All</button>
      <button id="stopBtn" class="btn btn-danger" hidden>Stop</button>
      <button id="scanBtn" class="btn btn-primary">Scan Page</button>
    </div>

    <div id="progress" class="progress-container" hidden>
      <div class="progress-bar-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <span id="progressText" class="progress-text">0 / 0</span>
    </div>

    <div id="status" class="status-msg"></div>

    <div id="results"></div>
  </div>

  <script src="../vendor/sentry.min.js"></script>
  <script src="popup.js"></script>
  <script src="indexability.js"></script>
  <script src="link-scanner.js"></script>
</body>
</html>
